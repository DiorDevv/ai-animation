<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131b" />
    <title>Bizning muzeyimiz</title>
  </head>
  <body>
    <canvas id="scene" aria-label="Xotiralar muzeyi"></canvas>

    <section id="intro">
      <h1 id="intro-title"></h1>
      <p class="from-to">
        <span>Kimdan</span> <em id="intro-from"></em>
        <span class="sep">·</span>
        <span>Kimga</span> <em id="intro-to"></em>
      </p>
      <div class="bar" role="progressbar" aria-label="Yuklanmoqda"><div id="bar-fill"></div></div>
      <p id="status">Yuklanmoqda…</p>
      <form id="profile" hidden autocomplete="off">
        <label class="field">
          <span>Ismingiz</span>
          <input id="name" name="name" maxlength="20" required />
        </label>
        <fieldset class="genders">
          <legend>Jinsingiz</legend>
          <label><input type="radio" name="gender" value="female" /><span>Ayol</span></label>
          <label><input type="radio" name="gender" value="male" /><span>Erkak</span></label>
        </fieldset>
        <button id="enter" type="submit" disabled>Muzeyga kirish</button>
      </form>
    </section>

    <div id="hud" hidden>
      <p id="hint"></p>
      <button id="tag" hidden></button>
      <button id="music" class="round" hidden aria-label="Musiqani o‘chirish yoki yoqish">♪</button>
      <p id="progress"></p>
      <button id="dance"></button>
      <div id="stick" hidden aria-hidden="true"><div id="knob"></div></div>
    </div>

    <div id="letter" hidden>
      <article class="letter-card">
        <h2 id="letter-title"></h2>
        <div id="letter-body"></div>
        <p id="letter-sign"></p>
        <button id="letter-close">Muzeyga qaytish</button>
      </article>
    </div>

    <aside id="panel" hidden>
      <div class="panel-text">
        <p id="panel-date"></p>
        <h2 id="panel-title"></h2>
        <p id="panel-note"></p>
      </div>
      <div class="panel-nav">
        <button id="voice" class="round" hidden aria-label="Ovozli xabarni tinglash yoki to‘xtatish">▶</button>
        <button id="prev" class="round" aria-label="Oldingi xotira">‹</button>
        <button id="next" class="round" aria-label="Keyingi xotira">›</button>
        <button id="close" class="round" aria-label="Yopish">✕</button>
      </div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
